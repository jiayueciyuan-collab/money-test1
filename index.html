<style>
  :root {
    --bg: #FFF6EC;
    --bg-soft: #FFFBF3;
    --card: #FFFFFF;
    --ink: #3A2614;
    --ink-soft: #6B5340;
    --muted: #A89078;

  html, body {

    pointer-events: none;

    opacity: 0.5;

  .deco-1 { top: 8%; left: 5%; font-size: 2.2rem; animation: float 6s ease-in-out infinite; }
  .deco-2 { top: 15%; right: 8%; font-size: 1.8rem; animation: float 7s ease-in-out infinite 0.5s; }
  .deco-3 { bottom: 12%; left: 8%; font-size: 2rem; animation: float 5.5s ease-in-out infinite 1s; }
  .deco-4 { bottom: 20%; right: 6%; font-size: 2.4rem; animation: float 6.5s ease-in-out infinite 0.3s; }
  .deco-5 { top: 45%; left: 3%; font-size: 1.5rem; animation: float 8s ease-in-out infinite 0.8s; }
  .deco-6 { top: 50%; right: 3%; font-size: 1.6rem; animation: float 7.5s ease-in-out infinite 1.2s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  /* 主容器 */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  /* 通用卡片 */

    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 28px;
    position: relative;
    overflow: hidden;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .screen.hidden {
    display: none;
  }

  .screen.fade-out {
    opacity: 0;
    transform: translateY(20px) scale(0.98);
  }

  .screen.fade-in {
    animation: fadeInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }

  }

  /* ===== 开始页 ===== */

    text-align: center;
  }

  .start-emoji {
    font-size: 4.5rem;
    margin-bottom: 8px;
    animation: bounce 2s ease-in-out infinite;

    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;

    align-items: center;

  .progress-label {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent-deep);

    height: 10px;
    background: var(--rule);

    font-weight: 700;

  }

  .q-opt {

    border-radius: var(--radius-sm);

  .result-actions {

    margin-top: 24px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 130px;
    border: none;
    padding: 14px 20px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    box-shadow: 0 4px 14px rgba(194, 65, 12, 0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(194, 65, 12, 0.4); }

  .btn-secondary {
    background: var(--bg-soft);

    border: 2px solid var(--rule);

  /* 分享提示 */
  .share-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(58, 38, 20, 0.92);
    color: white;
    padding: 16px 28px;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-weight: 600;
    z-index: 999;

    pointer-events: none;

  .share-toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);

  /* 撒花特效 */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 100;
    animation: confettiFall 3s linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* 响应式 */
  @media (max-width: 480px) {
    .screen { padding: 28px 20px; border-radius: 20px; }
    .start-title { font-size: 1.6rem; }
    .start-emoji { font-size: 3.5rem; }
    .result-type-name { font-size: 1.7rem; }
    .result-emoji { font-size: 4rem; }
    .q-text { font-size: 1.05rem; }
    .q-opt { padding: 14px 16px; font-size: 0.92rem; }
    .info-row { gap: 8px; }
    .info-badge { padding: 6px 12px; font-size: 0.78rem; }
  }

  @media (min-width: 768px) {
    .screen { max-width: 560px; padding: 44px 36px; }
  }
</style>
</head>

<script>

/* ===================== 超库(Supabase)配置 ===================== */
/* ⚠️ 部署前请把下面两行替换成你自己的超库信息（教程里有详细说明） */
const SUPABASE_URL = 'https://你的项目id.supabase.co';
const SUPABASE_ANON_KEY = '你的anon公钥';
let supabaseClient = null;
try {
  if (window.supabase && SUPABASE_URL.indexOf('你的项目id') === -1) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch(e) { console.log('超库未配置，数据不会上传（仅本地运行）'); }

async function saveResultToSupabase(code, dimScores) {
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('test_results')
      .insert([{
        personality_type: code,
        dim_scores: dimScores,
        created_at: new Date().toISOString()
      }]);
    if (error) console.log('上报失败(可能是未配置超库):', error.message);
  } catch(e) { /* 静默失败，不影响用户体验 */ }
}

/* ===================== 核心逻辑 ===================== */
let currentQ = 0;
let scores = [0, 0, 0, 0]; // 4个维度的得分
let answers = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const el = document.getElementById(id);
  el.classList.remove('hidden');
  el.classList.remove('fade-out');
  el.classList.add('fade-in');
  setTimeout(() => el.classList.remove('fade-in'), 600);
}

function startQuiz() {
  currentQ = 0;
  scores = [0, 0, 0, 0];
  answers = [];
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  const content = document.getElementById('quizContent');

  content.classList.remove('slide-in');
  content.classList.add('slide-out');

  setTimeout(() => {
    const optHtml = q.options.map((opt, i) =>
      `<button class="q-opt" onclick="selectOption(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`
    ).join('');

    content.innerHTML = `
      <p class="q-text">${q.text}</p>
      <div class="q-options">${optHtml}</div>
    `;

    content.classList.remove('slide-out');
    content.classList.add('slide-in');

    // 更新进度
    const pct = Math.round(((currentQ + 1) / questions.length) * 100);
    document.getElementById('progressLabel').textContent = `第 ${currentQ + 1} / ${questions.length} 题`;
    document.getElementById('progressPercent').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';

    setTimeout(() => content.classList.remove('slide-in'), 450);
  }, 250);
}

function selectOption(idx) {
  const q = questions[currentQ];
  // A=5, B=3, C=1
  const score = [5, 3, 1][idx];
  scores[q.dim] += score;
  answers.push(idx);

  // 选中动画
  const opts = document.querySelectorAll('.q-opt');
  opts[idx].classList.add('selected', 'correct-flash');

  // 自动切换下一题
  setTimeout(() => {
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 500);
}

function showResult() {
  // 计算4个维度的极点
  const poles = scores.map(s => s >= 15);
  const code = poles.map((isLeft, i) => {
    const left = poleLabels[i].left.split(' ')[0];
    const right = poleLabels[i].right.split(' ')[0];
    return isLeft ? left : right;
  }).join('');

  const type = types[code];
  // 把结果上报到超库（静默执行，失败不影响页面）
  saveResultToSupabase(code, scores.slice());
  const dimDetails = scores.map((s, i) => {
    const isLeft = s >= 15;
    return {
      name: dimNames[i],
      score: s,
      label: isLeft ? poleLabels[i].left : poleLabels[i].right
    };
  });

  const dimScoresHtml = dimDetails.map(d => `
    <div class="dim-score-item">
      <div class="dim-score-label">${d.name}</div>
      <div class="dim-score-value">${d.label} (${d.score}/25)</div>
    </div>
  `).join('');

  document.getElementById('resultContent').innerHTML = `
    <div class="result-badge">你的金钱人格</div>
    <div class="result-emoji">${type.emoji}</div>
    <div class="result-type-code">${code}</div>
    <h2 class="result-type-name">${type.name}</h2>
    <p class="result-tagline">「${type.tagline}」</p>

    <div class="dim-scores">${dimScoresHtml}</div>

    <div class="result-section">
      <h4>💡 核心特征</h4>
      <p>${type.core}</p>
    </div>
    <div class="result-section">
      <h4>✨ 你的优势</h4>
      <p>${type.strength}</p>
    </div>
    <div class="result-section">
      <h4>⚠️ 需要注意</h4>
      <p>${type.blind}</p>
    </div>
    <div class="result-section advice">
      <h4>🌱 专属理财建议</h4>
      <p>${type.advice}</p>
    </div>

    <div class="result-actions">
      <button class="action-btn btn-primary" onclick="shareResult()">📤 分享结果</button>
      <button class="action-btn btn-secondary" onclick="restart()">🔄 重新测试</button>
    </div>
  `;

  showScreen('resultScreen');
  launchConfetti();
}

function shareResult() {
  const code = scores.map((s, i) => s >= 15 ? poleLabels[i].left.split(' ')[0] : poleLabels[i].right.split(' ')[0]).join('');
  const type = types[code];
  const text = `我的金钱人格是「${type.name} ${type.emoji}」(${code})\n${type.tagline}\n\n快来测测你的金钱人格吧！💰`;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('结果已复制到剪贴板 📋'));
  } else if (navigator.share) {
    navigator.share({ title: '金钱人格测试', text }).catch(() => showToast('分享已取消'));
  } else {
    showToast('长按文字即可复制分享 📋');
  }
}

function showToast(msg) {
  const toast = document.getElementById('shareToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function restart() {
  showScreen('startScreen');
}

function launchConfetti() {
  const colors = ['#D97706', '#C2410C', '#F59E0B', '#FB923C', '#B45309'];
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDelay = Math.random() * 0.5 + 's';
      c.style.width = (6 + Math.random() * 8) + 'px';
      c.style.height = c.style.width;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3500);
    }, i * 30);
  }
}
